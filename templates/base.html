<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fonksiyonel Fiyat Takip{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-box-seam me-2"></i>Fonksiyonel Fiyat Takip
    </a>
    <div class="ms-auto d-flex align-items-center gap-3">
      <a href="/karsilastir" class="btn btn-outline-light btn-sm">
        <i class="bi bi-arrow-left-right me-1"></i>Karşılaştır
      </a>
      <a href="https://fonksiyonel.tr" target="_blank" class="btn btn-outline-light btn-sm">
        <i class="bi bi-box-arrow-up-right me-1"></i>Siteye Git
      </a>
    </div>
  </div>
</nav>

<main class="container py-4">
  {% block content %}{% endblock %}
</main>

<footer class="bg-dark text-secondary text-center py-3 mt-5">
  <small>Veriler otomatik olarak her gün güncellenir &middot; fonksiyonel.tr</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
